{% extends 'blog/auth_base.html' %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-slate-100">

    <div class="w-full max-w-md bg-white p-10 shadow-lg rounded-lg">

        <div class="text-center mb-10">
            <h1 class="text-5xl font-bold tracking-wide">Discover</h1>
            <p class="text-gray-500 mt-2">
                Welcome back! Sign in to continue.
            </p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="username" class="block text-sm font-semibold mb-2">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                    class="w-full border-b-2 border-gray-300 focus:border-blue-600 outline-none py-2"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold mb-2">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    class="w-full border-b-2 border-gray-300 focus:border-blue-600 outline-none py-2"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700 transition"
            >
                Sign In
            </button>

        </form>

        <p class="text-center mt-8 text-gray-600">
            Don't have an account?

            <a
                href="{% url 'register' %}"
                class="text-blue-600 font-semibold hover:underline"
            >
                Create Account
            </a>
        </p>

    </div>

</div>

{% endblock %}
