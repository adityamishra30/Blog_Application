{% extends 'blog/auth_base.html' %}

{% block content %}

<div class="min-h-screen flex flex-col justify-center items-center bg-[#F9FAFB] px-4 py-12">

    <div class="w-full max-w-md bg-white border border-gray-200 p-8 sm:p-10">

        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <a href="{% url 'home' %}" class="text-3xl font-extrabold tracking-tight text-gray-900 inline-block">
                Discover
            </a>
            <p class="text-xs text-gray-500 mt-2 font-medium">
                Welcome back. Sign in to your account.
            </p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">
                    USERNAME
                </label>
                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                    class="w-full border border-gray-300 p-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-gray-900 bg-white font-medium"
                >
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">
                    PASSWORD
                </label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    class="w-full border border-gray-300 p-3 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-gray-900 bg-white font-medium"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-[#3843D0] hover:bg-indigo-700 text-white text-xs font-bold uppercase tracking-wider py-3.5 transition"
            >
                SIGN IN
            </button>
        </form>

        <div class="mt-8 text-center border-t border-gray-100 pt-6">
            <p class="text-xs text-gray-500">
                Don't have an account?
                <a href="{% url 'register' %}" class="text-[#3843D0] font-bold hover:underline ml-1">
                    Create Account
                </a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
