{% extends "blog/app_base.html" %}

{% block content %}

<div class="min-h-screen bg-gray-50 py-10 px-4">

    <div class="max-w-4xl mx-auto">

        <!-- Header -->

        <div class="mb-10 text-center">
            <h1 class="text-4xl font-bold text-gray-900">
                ✍️ Create New Post
            </h1>

            <p class="text-gray-500 mt-2">
                Share your thoughts with the world.
            </p>
        </div>

        <!-- Form Card -->

        <div class="bg-white rounded-3xl shadow-lg border border-gray-200 p-8">

            <form method="POST" enctype="multipart/form-data" class="space-y-8">

                {% csrf_token %}

                <!-- Cover Image -->

                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-3">
                        Cover Image
                    </label>

                    <div
                        class="border-2 border-dashed border-gray-300 rounded-2xl p-10 text-center hover:border-black transition duration-300">

                        <div class="text-5xl mb-3">
                            📷
                        </div>

                        <p class="text-gray-600 mb-4">
                            Upload a cover image
                        </p>

                        {{ form.cover_image }}

                    </div>

                </div>

                <!-- Title -->

                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Title
                    </label>

                    {{ form.title }}

                </div>

                <!-- Content -->

                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Content
                    </label>

                    {{ form.content }}

                </div>

                <!-- Status -->

                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Status
                    </label>

                    <div class="max-w-xs">
                        {{ form.status }}
                    </div>

                </div>

                <!-- Buttons -->

                <div class="flex justify-end gap-4 pt-4">

                    <a href="{% url 'home' %}"
                        class="px-6 py-3 rounded-xl border border-gray-300 hover:bg-gray-100 transition">

                        Cancel

                    </a>

                    <button
                        type="submit"
                        class="bg-black text-white px-8 py-3 rounded-xl hover:bg-gray-800 transition duration-300 shadow">

                        Publish Post

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
