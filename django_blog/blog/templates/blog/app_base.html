{% extends "blog/base.html" %}

{% block body %}

<!-- Discover Header / Navbar -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 h-16 flex justify-between items-center">

        <!-- Logo -->
        <a href="{% url 'home' %}" class="text-2xl font-extrabold tracking-tight text-gray-900">
            Discover
        </a>

        <!-- Center Navigation -->
        <div class="flex items-center gap-8 text-sm font-medium">
            <a href="{% url 'home' %}" 
               class="{% if request.resolver_match.url_name == 'home' %}text-gray-900 font-semibold border-b-2 border-[#3843D0] pb-5 pt-5 -mb-[1px]{% else %}text-gray-600 hover:text-gray-900 transition py-5{% endif %}">
                Feed
            </a>

            <a href="{% url 'search' %}" 
               class="{% if request.resolver_match.url_name == 'search' %}text-gray-900 font-semibold border-b-2 border-[#3843D0] pb-5 pt-5 -mb-[1px]{% else %}text-gray-600 hover:text-gray-900 transition py-5{% endif %}">
                Explore
            </a>

            <a href="{% url 'drafts' %}" 
               class="{% if request.resolver_match.url_name == 'drafts' %}text-gray-900 font-semibold border-b-2 border-[#3843D0] pb-5 pt-5 -mb-[1px]{% else %}text-gray-600 hover:text-gray-900 transition py-5{% endif %}">
                Drafts
            </a>
        </div>

        <!-- Right Action Bar -->
        <div class="flex items-center gap-4 sm:gap-6">
            <!-- Search Icon button pointing to search page -->
            <a href="{% url 'search' %}" class="text-gray-600 hover:text-gray-900 p-1 transition" title="Search">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
            </a>

            <!-- Write Button -->
            <a href="{% url 'create_post' %}" 
               class="bg-[#3843D0] hover:bg-indigo-700 text-white text-xs uppercase font-bold tracking-wider px-5 py-2 rounded-full transition duration-200">
                Write
            </a>

            <!-- Profile Avatar Thumbnail -->
            {% if request.user.is_authenticated %}
            <a href="{% url 'profile' %}" class="flex items-center text-gray-700 hover:text-gray-900 transition" title="Profile">
                <img src="{{ request.user.profile.profile_image.url }}" class="w-8 h-8 rounded-full object-cover border border-gray-200" alt="{{ request.user.username }}">
            </a>
            {% endif %}
        </div>

    </div>
</nav>

<!-- Page Content Block -->
<main class="flex-grow">
    {% block content %}
    {% endblock %}
</main>

<!-- Discover Footer -->
<footer class="border-t border-gray-200 py-8 bg-[#F9FAFB] mt-auto">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 text-center text-xs text-gray-500">
        <span class="text-sm font-black text-gray-900 tracking-tight mr-2">Discover</span>
        <span>© 2024 Discover Editorial. All rights reserved.</span>
    </div>
</footer>

{% endblock %}
