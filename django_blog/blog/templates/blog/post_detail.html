{% extends "blog/app_base.html" %}

{% block content %}

<div class="min-h-screen bg-gray-50 py-10">

    <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-lg overflow-hidden">

        {% if post.cover_image %}
            <img
                src="{{ post.cover_image.url }}"
                alt="{{ post.title }}"
                class="w-full h-96 object-cover">
        {% endif %}

        <div class="p-10">

            <p class="text-gray-500 text-sm">
                By {{ post.author.username }}
                •
                {{ post.created_at|date:"F d, Y" }}
            </p>

            <h1 class="text-5xl font-bold mt-4">
                {{ post.title }}
            </h1>

            <div class="mt-8 text-lg leading-8 text-gray-700 whitespace-pre-line">

                {{ post.content }}

            </div>

            <a
                href="{% url 'home' %}"
                class="inline-block mt-10 px-6 py-3 rounded-xl bg-black text-white hover:bg-gray-800 transition">

                ← Back to Home

            </a>

        </div>

    </div>

</div>

{% endblock %}
